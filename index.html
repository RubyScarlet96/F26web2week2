<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Week 2 Review of Flex and Grid</title>
</head>
<body>
    <div class="container">
        <!-- Prompt to generate the nav, inside the container div, add a nav with a ul inside. In the ul add five list items, in all except the forth li, add an anchor with # as the link, one each for home, about, stuff and contact. In the fourth li add a ul with four li inside and in each of those li add an anchor with # as the link and a random word about dogs. -->
        <nav>
            <ul>
                <li><a href="#">
                    <img src="images/cutepuppy.jpg" alt="A cute black lab puppy"
                </a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Stuff</a></li>
                <li> 
                    <a href="#">Dogs</a>
                    <ul>
                        <li><a href="#">Puppy</a></li>
                        <li><a href="#">Loyal</a></li>
                        <li><a href="#">Fetch</a></li>
                        <li><a href="#">Tail</a></li>
                    </ul>
                </li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <main>
            <!-- ai prompt inside the main add a section with 6 divs each with an increasing number from 1 to 6 -->
            <section>
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
            </section>
        </main>
    </div>
</body>
</html>
